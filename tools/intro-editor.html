<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Editor de intro — Vividice</title>
<style>
  :root {
    --bg: #0a0a0b;
    --surface: #141518;
    --panel: #17191d;
    --text: #edeff2;
    --muted: #97a0ab;
    --accent: #e63329;
    --accent-2: #46b7c4;
    --border: rgba(237, 239, 242, 0.12);
    --serif: "Iowan Old Style", Palatino, Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    z-index: 10;
  }
  header h1 { font: 600 13px/1 system-ui; margin: 0; }
  header .spacer { flex: 1; }
  .status { font-size: 12px; color: var(--muted); }
  .status.ok { color: var(--accent-2); }
  .status.err { color: var(--accent); }
  button, select, input, textarea {
    font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 6px; padding: 5px 9px;
  }
  button { cursor: pointer; transition: border-color .12s, color .12s, background .12s; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button:disabled:hover { border-color: var(--border); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary:hover { opacity: .9; }
  button.ghost { background: transparent; }

  .stage { flex: 1; position: relative; overflow: hidden; }
  .canvas { position: absolute; inset: 0; cursor: grab;
    background:
      radial-gradient(circle at 1px 1px, rgba(237,239,242,0.06) 1px, transparent 0) 0 0 / 26px 26px; }
  .canvas.panning { cursor: grabbing; }
  .canvas.connecting { cursor: crosshair; }
  .world { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
  .edges { position: absolute; top: 0; left: 0; overflow: visible; pointer-events: none; }

  .node {
    position: absolute; width: 190px; height: 64px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; cursor: grab;
    display: flex; flex-direction: column; gap: 3px; user-select: none;
  }
  .node:hover { border-color: var(--muted); }
  .node.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .node.start { border-left: 3px solid var(--accent-2); }
  .node__id { font: 600 11px/1 ui-monospace, monospace; color: var(--text); display: flex; gap: 6px; align-items: center; }
  .node__id .star { color: var(--accent-2); }
  .node__text { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .node__kind { font-size: 9px; text-transform: uppercase; letter-spacing: .06em; margin-top: auto; }
  .k-next { color: var(--muted); }
  .k-choice { color: var(--accent-2); }
  .k-end { color: var(--accent); }

  .port {
    position: absolute; width: 11px; height: 11px; border-radius: 50%;
    background: var(--bg); border: 1.5px solid var(--muted); cursor: crosshair;
    transform: translate(-50%, -50%); pointer-events: auto;
  }
  .port:hover, .port.armed { border-color: var(--accent); background: var(--accent); }
  .port.in { border-color: var(--border); cursor: default; }

  .inspector {
    position: absolute; top: 0; right: 0; bottom: 0; width: 320px;
    background: var(--panel); border-left: 1px solid var(--border);
    padding: 16px; overflow-y: auto; transform: translateX(100%);
    transition: transform .18s ease; z-index: 8;
  }
  .inspector.open { transform: none; }
  .insp__head { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .insp__head .spacer { flex: 1; }
  .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); display: block; margin-bottom: 4px; margin-top: 12px; }
  .inspector input, .inspector select, .inspector textarea { width: 100%; }
  textarea { resize: vertical; min-height: 64px; }
  select.next.missing { border-color: var(--accent); }
  .opt { border: 1px solid var(--border); border-radius: 8px; padding: 8px; margin-top: 8px; }
  .opt__head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .opt__head span { font: 10px/1 ui-monospace, monospace; color: var(--muted); }
  .del { color: var(--muted); border-color: transparent; background: transparent; }
  .del:hover { color: var(--accent); }
  .hint { font-size: 12px; color: var(--muted); font-style: italic; margin-top: 10px; }
  .guide { font-style: normal; line-height: 1.7; }
  .guide code { font-family: ui-monospace, monospace; font-size: 11px; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
  .guide .dim { opacity: .6; }
  .toggle { font-size: 11px; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; text-transform: none; letter-spacing: 0; cursor: pointer; }
  .toggle input { width: auto; margin: 0; }
  .kvrow { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
  .kvrow input { min-width: 0; }
  .kvrow .eq { color: var(--muted); }
  .lbl.row { display: flex; align-items: center; justify-content: space-between; }
  .warn { color: var(--accent); }
  .insp__actions { display: flex; gap: 8px; margin-top: 18px; }

  .overlay { position: fixed; inset: 0; z-index: 30; background: #000;
    display: none; align-items: center; justify-content: center; cursor: pointer; padding: 8vw; }
  .overlay.open { display: flex; }
  .pv { max-width: 60ch; text-align: center; }
  .pv__text { font-family: var(--serif); font-size: clamp(1.4rem, 3vw, 2.2rem); line-height: 1.4; min-height: 1.4em; margin: 0; }
  .pv__char { animation: fadein .5s ease both; }
  /* Palabra: caja atómica que no se corta por dentro (las letras onduladas son
     inline-block; sin esto el navegador partiría palabras en cualquier letra). */
  .pv__word { display: inline-block; white-space: nowrap; }
  @keyframes fadein { from { opacity: 0 } to { opacity: 1 } }
  .pv__wave { display: inline-block; white-space: pre; animation: pv-wave 3.2s ease-in-out infinite; }
  @keyframes pv-wave { 0%,100% { transform: translateY(0.14em) } 50% { transform: translateY(-0.14em) } }
  .pv__opts { list-style: none; padding: 0; margin: 28px 0 0; display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .pv__opts button { min-width: 16rem; padding: 12px 24px; }
  /* Orbital (6+ opciones): giran lento en torno a la pregunta. */
  .pv__orbit { position: fixed; inset: 0; margin: 0; padding: 0; list-style: none;
    display: grid; place-items: center; pointer-events: none;
    --r: clamp(150px, 34vmin, 340px); animation: pv-orbit-spin 90s linear infinite; }
  .pv__orbiter { grid-area: 1 / 1; transform: rotate(var(--a)) translate(var(--r)) rotate(calc(-1 * var(--a))); }
  .pv__oorbit { pointer-events: auto; min-width: 0; padding: 8px 16px;
    animation: pv-orbit-spin 90s linear infinite reverse; }
  @keyframes pv-orbit-spin { to { transform: rotate(360deg) } }
  .pv__arrow { margin-top: 28px; font-size: 1.6rem; color: var(--muted); opacity: .5; }
  .pv__close { position: fixed; top: 16px; right: 20px; font-size: 13px; color: var(--muted); }

  .help { position: absolute; bottom: 12px; left: 12px; font-size: 11px; color: var(--muted); z-index: 6; pointer-events: none; }
</style>
</head>
<body>
<header>
  <h1>Editor de intro</h1>
  <span id="status" class="status">cargando…</span>
  <span class="spacer"></span>
  <button id="add">+ Nodo</button>
  <button id="play">▶ Probar</button>
  <button id="playHere" disabled>▶ Desde aquí</button>
  <button id="fit" class="ghost">Centrar</button>
  <button id="reload" class="ghost">Recargar</button>
  <button id="save" class="primary">Guardar</button>
</header>

<div class="stage">
  <div id="canvas" class="canvas">
    <div id="world" class="world">
      <svg id="edges" class="edges"></svg>
    </div>
  </div>
  <div class="help">arrastrá el fondo para mover · rueda para zoom · arrastrá desde un punto de salida a otro nodo para conectar (o soltá en el vacío para crear uno)</div>
  <aside id="inspector" class="inspector"></aside>
</div>

<datalist id="flagnames"></datalist>
<datalist id="musicnames"></datalist>

<div id="overlay" class="overlay">
  <span class="pv__close">esc para cerrar</span>
  <div class="pv"><p id="pvText" class="pv__text"></p><div id="pvAfter"></div></div>
</div>

<script type="module">
const SVGNS = 'http://www.w3.org/2000/svg';
const W = 190, H = 64;
const POS_KEY = 'vividice:intro-pos';
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, props = {}, kids = []) => {
  /* `list` es propiedad de sólo-lectura en <input> (apunta al datalist), así
     que va por setAttribute; el resto por asignación directa. */
  const { list, ...rest } = props;
  const n = Object.assign(document.createElement(tag), rest);
  if (list != null) n.setAttribute('list', list);
  for (const k of [].concat(kids)) if (k != null) n.append(k);
  return n;
};

let script = { start: '', steps: {} };
let pos = {};
let selected = null;
let dirty = false;
let view = { x: 60, y: 60, z: 1 };

const canvas = $('#canvas');
const world = $('#world');
const svg = $('#edges');
const inspector = $('#inspector');

function setStatus(msg, cls = '') { const s = $('#status'); s.textContent = msg; s.className = 'status ' + cls; }
function markDirty() { dirty = true; setStatus('cambios sin guardar', 'err'); }
function kindOf(step) {
  if (step.input) return 'input';
  if (Array.isArray(step.options)) return 'choice';
  /* 'continuar' si existe la clave next (aunque su destino esté sin definir);
     'fin' sólo si no existe. Así un destino vacío no se confunde con un final. */
  return 'next' in step ? 'next' : 'end';
}
/* ¿Alguna opción tiene su propio destino? Entonces la elección bifurca y
   dibuja un puerto por opción. Si no, converge: un solo puerto al `next`. */
function optionBranches(o) { return 'next' in o; }   // tiene destino propio (aunque sea fin)
function isBranchingChoice(step) {
  return Array.isArray(step.options) && step.options.some(optionBranches);
}
function isFlagChoice(step) {
  return Array.isArray(step.options) && !isBranchingChoice(step);
}
/* Todas las flags nombradas en el guion, para autocompletar. */
function allFlags() {
  const names = new Set();
  const addKeys = (o) => o && Object.keys(o).forEach((k) => names.add(k));
  for (const s of Object.values(script.steps)) {
    addKeys(s.set);
    if (s.text && typeof s.text === 'object' && s.text.on) names.add(s.text.on);
    if (Array.isArray(s.next)) s.next.forEach((r) => {
      if (r.when && Array.isArray(r.when.terms)) r.when.terms.forEach((t) => t.flag && names.add(t.flag));
      else addKeys(r.when);
    });
    if (Array.isArray(s.options)) for (const o of s.options) {
      addKeys(o.set);
      if (o.when && Array.isArray(o.when.terms)) o.when.terms.forEach((t) => t.flag && names.add(t.flag));
      else addKeys(o.when);
    }
  }
  return [...names].filter(Boolean);
}
function refreshFlagList() {
  const dl = $('#flagnames');
  dl.innerHTML = '';
  for (const f of allFlags()) dl.append(el('option', { value: f }));
}
/* Temas disponibles en public/music (para autocompletar el campo Música). */
async function refreshMusicList() {
  try {
    const res = await fetch('/api/music');
    const names = await res.json();
    const dl = $('#musicnames');
    dl.innerHTML = '';
    for (const n of names) dl.append(el('option', { value: n }));
  } catch { /* sin música, no pasa nada */ }
}
/* Opciones-flag de todo el guion que convergen en `id`. Da los "inputs" del
   nodo: cada una aporta {flag, value, label} para derivar un texto por elección. */
function incomingCases(id) {
  const out = [];
  for (const s of Object.values(script.steps)) {
    if (!isFlagChoice(s) || s.next !== id) continue;
    for (const o of s.options) {
      if (!o.set) continue;
      for (const [flag, value] of Object.entries(o.set)) out.push({ flag, value, label: o.label });
    }
  }
  return out;
}
/* Cantidad de puertos de salida (para anclas y aristas). */
function outCount(step) {
  const k = kindOf(step);
  if (k === 'next' || k === 'input') return Array.isArray(step.next) ? step.next.length : 1;
  if (k === 'choice') return step.options.length;   // un puerto por opción, siempre
  return 0;
}
function stripRich(s) { return (s || '').replace(/\[\[\/?.*?\]\]/g, '').replace(/\{\{.*?\}\}/g, '').replace(/\\n|\n/g, ' '); }
function nodeTextPreview(step) {
  const t = step.text;
  if (t && typeof t === 'object') {
    const first = Object.values(t.cases || {}).find(Boolean) || t.default;
    return '⌥ ' + (stripRich(first) || '(texto variable)');
  }
  return stripRich(t) || '(sin texto)';
}
function kindLabel(step) {
  const k = kindOf(step);
  if (k === 'input') return 'campo · ' + (step.input.flag || '?');
  if (k === 'next') return Array.isArray(step.next) ? 'continuar · ' + step.next.length + ' ramas' : 'continuar';
  if (k === 'choice') return 'elección · ' + step.options.length;
  return 'fin';
}
/* Destino de cada puerto, alineado con outAnchors. */
function outTargets(id) {
  const step = script.steps[id], k = kindOf(step);
  if (k === 'next' || k === 'input') return Array.isArray(step.next) ? step.next.map((r) => r.go) : [step.next];
  if (k === 'choice') {
    /* Cada opción tiene su propio destino. Si no lo definió, cae al `next`
       compartido (compatibilidad con elecciones convergentes legacy). */
    const shared = typeof step.next === 'string' ? step.next : null;
    return step.options.map((o) => ('next' in o ? (o.next || null) : shared));
  }
  return [];
}
function loadPos() { try { pos = JSON.parse(localStorage.getItem(POS_KEY)) || {}; } catch { pos = {}; } }
function savePos() { localStorage.setItem(POS_KEY, JSON.stringify(pos)); }

function autolayout() {
  const ids = Object.keys(script.steps);
  const depth = {};
  const q = script.steps[script.start] ? [script.start] : [];
  depth[script.start] = 0;
  while (q.length) {
    const id = q.shift();
    const step = script.steps[id];
    const targets = outTargets(id);
    for (const t of targets)
      if (t && script.steps[t] && depth[t] === undefined) { depth[t] = depth[id] + 1; q.push(t); }
  }
  const rows = {};
  for (const id of ids) {
    if (pos[id]) continue;
    const d = depth[id] ?? 0;
    rows[d] = (rows[d] ?? 0) + 1;
    pos[id] = { x: d * 260, y: (rows[d] - 1) * 110 };
  }
}

async function load() {
  const res = await fetch('/api/script');
  script = await res.json();
  loadPos();
  /* Normaliza los ids al abrir, según la topología actual. */
  const remap = recomputeIds();
  const renamed = Object.keys(remap).some((k) => remap[k] !== k);
  autolayout();
  selected = null;
  dirty = renamed;
  refreshFlagList();
  refreshMusicList();
  renderGraph();
  renderInspector();
  setStatus(renamed ? 'cargado · ids renumerados (guardá para fijar)' : 'cargado', renamed ? '' : 'ok');
}

async function save() {
  setStatus('guardando…');
  const res = await fetch('/api/script', {
    method: 'PUT', headers: { 'content-type': 'application/json' },
    body: JSON.stringify(script, null, 2),
  });
  if (res.ok) { dirty = false; setStatus('guardado ✓', 'ok'); }
  else { const { error } = await res.json().catch(() => ({})); setStatus('error: ' + (error || res.status), 'err'); }
}

function applyView() { world.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.z})`; }

function outAnchors(id, step) {
  const p = pos[id];
  const n = outCount(step);
  if (n === 0) return [];
  if (n === 1) return [{ x: p.x + W, y: p.y + H / 2 }];
  return Array.from({ length: n }, (_, i) => ({ x: p.x + W, y: p.y + (H * (i + 1)) / (n + 1) }));
}
function inAnchor(id) { const p = pos[id]; return { x: p.x, y: p.y + H / 2 }; }

function drawEdges() {
  svg.innerHTML = '';
  for (const [id, step] of Object.entries(script.steps)) {
    const k = kindOf(step);
    const outs = outAnchors(id, step);
    const targets = outTargets(id);
    targets.forEach((t, i) => {
      if (!t || !script.steps[t]) return;
      const a = outs[i], b = inAnchor(t);
      const dx = Math.max(40, Math.abs(b.x - a.x) / 2);
      const path = document.createElementNS(SVGNS, 'path');
      path.setAttribute('d', `M ${a.x} ${a.y} C ${a.x + dx} ${a.y}, ${b.x - dx} ${b.y}, ${b.x} ${b.y}`);
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', k === 'choice' ? 'var(--accent-2)' : 'var(--muted)');
      path.setAttribute('stroke-width', '1.5');
      if (isFlagChoice(step)) path.setAttribute('stroke-dasharray', '4 4');
      path.setAttribute('opacity', id === selected ? '1' : '0.55');
      svg.append(path);
    });
  }
}

function renderGraph() {
  [...world.querySelectorAll('.node')].forEach((n) => n.remove());
  for (const [id, step] of Object.entries(script.steps)) {
    if (!pos[id]) pos[id] = { x: 0, y: 0 };
    const k = kindOf(step);
    const node = el('div', { className: 'node' + (id === selected ? ' selected' : '') + (id === script.start ? ' start' : '') });
    node.style.left = pos[id].x + 'px';
    node.style.top = pos[id].y + 'px';
    node.dataset.id = id;

    node.append(
      el('div', { className: 'node__id' }, [
        id === script.start ? el('span', { className: 'star', textContent: '★' }) : null,
        document.createTextNode(id),
      ]),
      el('div', { className: 'node__text', textContent: nodeTextPreview(step) }),
      el('div', { className: 'node__kind k-' + k, textContent: kindLabel(step) }),
    );

    const inp = el('div', { className: 'port in' });
    inp.style.left = '0px'; inp.style.top = H / 2 + 'px';
    node.append(inp);

    outAnchors(id, step).forEach((a, i) => {
      const port = el('div', { className: 'port out' });
      port.style.left = W + 'px';
      port.style.top = (a.y - pos[id].y) + 'px';
      port.addEventListener('mousedown', (e) => { e.stopPropagation(); e.preventDefault(); startWire(id, i, e); });
      node.append(port);
    });

    attachNodeDrag(node, id);
    world.append(node);
  }
  drawEdges();
}

function attachNodeDrag(node, id) {
  node.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    e.stopPropagation();
    const start = { mx: e.clientX, my: e.clientY, px: pos[id].x, py: pos[id].y };
    let moved = false;
    const move = (ev) => {
      const dx = (ev.clientX - start.mx) / view.z;
      const dy = (ev.clientY - start.my) / view.z;
      if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
      pos[id] = { x: start.px + dx, y: start.py + dy };
      node.style.left = pos[id].x + 'px';
      node.style.top = pos[id].y + 'px';
      drawEdges();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
      if (moved) savePos();
      else select(id);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  });
}

function startWire(fromId, i, e) {
  const a = outAnchors(fromId, script.steps[fromId])[i];
  const rect = canvas.getBoundingClientRect();
  const path = document.createElementNS(SVGNS, 'path');
  path.setAttribute('fill', 'none');
  path.setAttribute('stroke', 'var(--accent)');
  path.setAttribute('stroke-width', '2');
  path.setAttribute('stroke-dasharray', '5 4');
  svg.append(path);
  canvas.classList.add('connecting');
  let moved = false;
  const toWorld = (ev) => ({
    x: (ev.clientX - rect.left - view.x) / view.z,
    y: (ev.clientY - rect.top - view.y) / view.z,
  });
  const move = (ev) => {
    const w = toWorld(ev);
    if (Math.abs(w.x - a.x) + Math.abs(w.y - a.y) > 4) moved = true;
    const dx = Math.max(40, Math.abs(w.x - a.x) / 2);
    path.setAttribute('d', `M ${a.x} ${a.y} C ${a.x + dx} ${a.y}, ${w.x - dx} ${w.y}, ${w.x} ${w.y}`);
  };
  const up = (ev) => {
    window.removeEventListener('mousemove', move);
    window.removeEventListener('mouseup', up);
    path.remove();
    canvas.classList.remove('connecting');
    if (!moved) return renderGraph();
    const hit = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('.node');
    let targetId = hit?.dataset.id;
    if (!targetId) {
      const w = toWorld(ev);
      targetId = freshId();
      script.steps[targetId] = { text: '' };
      pos[targetId] = { x: w.x - W / 2, y: w.y - H / 2 };
      savePos();
    }
    if (targetId === fromId) return renderGraph();
    const s = script.steps[fromId], k = kindOf(s);
    if (k === 'choice') {
      s.options[i].next = targetId;            // puerto i = opción i
    } else if (Array.isArray(s.next)) {
      s.next[i].go = targetId;                 // rama condicional
    } else {
      s.next = targetId;
    }
    const remap = recomputeIds();
    markDirty();
    select(remap[targetId] || targetId);
  };
  window.addEventListener('mousemove', move);
  window.addEventListener('mouseup', up);
  move(e);
}

function select(id) {
  selected = id;
  renderGraph();
  renderInspector();
}
function deselect() { selected = null; renderGraph(); renderInspector(); }

function freshId() {
  const max = Object.keys(script.steps).reduce((m, id) => Math.max(m, parseInt(id, 10) || 0), 0);
  let n = max + 1;
  while (script.steps[String(n)]) n++;
  return String(n);
}

/* ── IDs estructurales: se recalculan desde la topología ──────────────────
   Spine numérico (1,2,3…), una letra por rama al bifurcar (4a,4b,4c) y -N
   para lo que sigue dentro de una rama (4a-1, 4a-2). Recorrido BFS desde el
   inicio; un nodo de convergencia conserva el id de la primera rama que lo
   alcanza. */
function idLetter(i) {
  let s = '', n = i;
  do { s = String.fromCharCode(97 + (n % 26)) + s; n = Math.floor(n / 26) - 1; } while (n >= 0);
  return s;
}
function continueId(parent) {
  const m = parent.match(/\d+$/);
  if (m) return parent.slice(0, parent.length - m[0].length) + (Number(m[0]) + 1);
  return parent + '-1';
}
function uniqueId(base, taken) {
  if (!taken.has(base)) return base;
  let n = 2, id = base + '_' + n;
  while (taken.has(id)) { n++; id = base + '_' + n; }
  return id;
}
/* Targets distintos y existentes de un nodo, en orden de puerto. */
function distinctTargets(id) {
  const seen = new Set(), out = [];
  for (const t of outTargets(id)) {
    if (!t || !script.steps[t] || seen.has(t)) continue;
    seen.add(t); out.push(t);
  }
  return out;
}
function recomputeIds() {
  const start = script.start;
  const remap = {};
  if (!script.steps[start]) { for (const id of Object.keys(script.steps)) remap[id] = id; return remap; }
  const taken = new Set(['1']);
  remap[start] = '1';
  const queue = [start];
  while (queue.length) {
    const oldId = queue.shift();
    const newId = remap[oldId];
    const targets = distinctTargets(oldId);
    const branching = targets.length > 1;
    /* Una rama avanza el número y le agrega una letra (12 → 13a/13b/13c); un
       único destino solo avanza el número (12 → 13). */
    const base = continueId(newId);
    targets.forEach((tOld, i) => {
      if (remap[tOld] !== undefined) return;            // convergencia/ciclo: ya tiene id
      const cand = uniqueId(branching ? base + idLetter(i) : base, taken);
      remap[tOld] = cand; taken.add(cand); queue.push(tOld);
    });
  }
  for (const oldId of Object.keys(script.steps)) {       // nodos sueltos: conservan su id
    if (remap[oldId] === undefined) { const c = uniqueId(oldId, taken); remap[oldId] = c; taken.add(c); }
  }
  applyRemap(remap);
  return remap;
}
function applyRemap(remap) {
  const r = (v) => (typeof v === 'string' && remap[v] !== undefined ? remap[v] : v);
  const steps = {};
  for (const [oldId, step] of Object.entries(script.steps)) {
    if (typeof step.next === 'string') step.next = r(step.next);
    else if (Array.isArray(step.next)) for (const rule of step.next) rule.go = r(rule.go);
    if (Array.isArray(step.options)) for (const o of step.options) if ('next' in o) o.next = r(o.next);
    steps[remap[oldId]] = step;
  }
  script.steps = steps;
  script.start = r(script.start);
  const np = {};
  for (const [oldId, p] of Object.entries(pos)) np[remap[oldId] !== undefined ? remap[oldId] : oldId] = p;
  pos = np; savePos();
  if (selected != null) selected = r(selected);
}
/* Aplica un cambio estructural: recalcula ids y redibuja. */
function structuralChange() { recomputeIds(); markDirty(); renderGraph(); renderInspector(); }

function changeKind(id, kind) {
  const step = script.steps[id];
  delete step.next; delete step.options; delete step.input;
  if (kind === 'next') step.next = '';
  else if (kind === 'input') { step.input = { flag: 'nombre', max: 20 }; step.next = ''; }
  else if (kind === 'choice') {
    /* Dos opciones con salidas abiertas; las flags se agregan a mano. */
    step.options = [{ label: 'Opción A' }, { label: 'Opción B' }];
    step.next = '';
  }
  structuralChange();
}

function renameStep(oldId, raw) {
  const newId = raw.trim();
  if (!newId || newId === oldId) return renderInspector();
  if (script.steps[newId]) { setStatus('ya existe "' + newId + '"', 'err'); return renderInspector(); }
  const rebuilt = {};
  for (const [k, v] of Object.entries(script.steps)) rebuilt[k === oldId ? newId : k] = v;
  script.steps = rebuilt;
  for (const step of Object.values(script.steps)) {
    if (step.next === oldId) step.next = newId;
    if (Array.isArray(step.next)) for (const r of step.next) if (r.go === oldId) r.go = newId;
    if (Array.isArray(step.options)) for (const o of step.options) if (o.next === oldId) o.next = newId;
  }
  if (script.start === oldId) script.start = newId;
  if (pos[oldId]) { pos[newId] = pos[oldId]; delete pos[oldId]; savePos(); }
  if (selected === oldId) selected = newId;
  markDirty(); renderGraph(); renderInspector();
}

function deleteStep(id) {
  if (id === script.start) return;
  delete script.steps[id];
  delete pos[id]; savePos();
  for (const step of Object.values(script.steps)) {
    if (step.next === id) step.next = '';
    if (Array.isArray(step.next)) for (const r of step.next) if (r.go === id) r.go = '';
    if (Array.isArray(step.options)) for (const o of step.options) if (o.next === id) o.next = '';
  }
  if (selected === id) selected = null;
  structuralChange();
}

function nextSelect(value, selfId, onChange) {
  const others = Object.keys(script.steps).filter((x) => x !== selfId);
  const missing = value && !others.includes(value);
  const sel = el('select', { className: 'next' + (missing ? ' missing' : '') });
  sel.append(el('option', { value: '', textContent: '— sin conectar —' }));
  for (const id of others) sel.append(el('option', { value: id, textContent: id }));
  if (missing) sel.append(el('option', { value, textContent: value + ' (no existe)' }));
  sel.value = value || '';
  sel.onchange = () => onChange(sel.value);
  return sel;
}

function updateNodeText(id) {
  const n = world.querySelector(`.node[data-id="${id}"] .node__text`);
  if (n) n.textContent = nodeTextPreview(script.steps[id]);
}

/* Editor de pares flag=valor sobre un objeto vivo. Los valores se mutan en el
   acto (sin re-render); cambiar/agregar/quitar claves llama a onStruct. */
function kvEditor(obj, addLabel, onStruct) {
  const wrap = el('div');
  for (const key of Object.keys(obj)) {
    const ki = el('input', { value: key, placeholder: 'flag', list: 'flagnames' });
    const vi = el('input', { value: obj[key], placeholder: 'valor' });
    const rm = el('button', { className: 'del', textContent: '✕' });
    vi.oninput = () => { obj[key] = vi.value; markDirty(); };
    ki.onchange = () => {
      const nk = ki.value.trim();
      if (nk === key) return;
      const v = obj[key]; delete obj[key];
      if (nk) obj[nk] = v;
      onStruct();
    };
    rm.onclick = () => { delete obj[key]; onStruct(); };
    wrap.append(el('div', { className: 'kvrow' }, [ki, el('span', { className: 'eq', textContent: '=' }), vi, rm]));
  }
  const add = el('button', { textContent: addLabel || '+ flag', style: 'margin-top:6px' });
  add.onclick = () => { let n = 'flag'; while (obj[n] !== undefined) n += '_'; obj[n] = ''; onStruct(); };
  wrap.append(add);
  return wrap;
}

/* Editor de cláusula condicional {op, terms}: lista de flag=valor combinadas
   con AND/OR (el selector aparece recién con 2+ términos). Muta `host[key]` in
   situ y migra la forma legacy {flag:valor}. `onEmpty` se llama al borrar el
   último término (el caller decide si quita la condición); `onRender`
   re-dibuja. Compartido por el ramificado y el "mostrar si" de las opciones. */
function appendClauseEditor(box, host, key, { onEmpty, onRender }) {
  let when = host[key];
  if (!when || !Array.isArray(when.terms)) {
    const terms = when ? Object.entries(when).map(([flag, value]) => ({ flag, value })) : [];
    when = host[key] = { op: 'and', terms: terms.length ? terms : [{ flag: '', value: '' }] };
  }
  if (when.terms.length > 1) {
    const opSel = el('select');
    opSel.append(el('option', { value: 'and', textContent: 'se cumplen TODAS (y)' }));
    opSel.append(el('option', { value: 'or', textContent: 'se cumple ALGUNA (o)' }));
    opSel.value = when.op || 'and';
    opSel.onchange = () => { when.op = opSel.value; markDirty(); };
    box.append(opSel);
  }
  when.terms.forEach((term, ti) => {
    const fi = el('input', { value: term.flag || '', placeholder: 'flag', list: 'flagnames' });
    const vi = el('input', { value: term.value || '', placeholder: 'valor' });
    const rmT = el('button', { className: 'del', textContent: '✕' });
    fi.oninput = () => { term.flag = fi.value.trim(); markDirty(); };
    vi.oninput = () => { term.value = vi.value; markDirty(); };
    rmT.onclick = () => {
      when.terms.splice(ti, 1);
      if (when.terms.length === 0 && onEmpty) return onEmpty();
      markDirty(); onRender();
    };
    box.append(el('div', { className: 'kvrow' }, [fi, el('span', { className: 'eq', textContent: '=' }), vi, rmT]));
  });
  const addT = el('button', { className: 'ghost', textContent: '+ condición', style: 'margin-top:6px;font-size:11px' });
  addT.onclick = () => { when.terms.push({ flag: '', value: '' }); markDirty(); onRender(); };
  box.append(addT);
}

function toggleTextVariable(id, on) {
  const step = script.steps[id];
  if (on) {
    const plain = typeof step.text === 'string' ? step.text : '';
    step.text = { on: '', cases: {}, default: plain };
  } else {
    const t = step.text;
    step.text = (t && typeof t === 'object')
      ? (Object.values(t.cases).find(Boolean) || t.default || '')
      : (t || '');
  }
  markDirty(); renderInspector(); updateNodeText(id);
}

function toggleBranch(id, on) {
  const step = script.steps[id];
  if (on) {
    const cur = typeof step.next === 'string' ? step.next : '';
    /* Default primero (sin `when`), después una condición. */
    step.next = [{ go: cur }, { when: { op: 'and', terms: [{ flag: '', value: '' }] }, go: '' }];
  } else {
    const def = Array.isArray(step.next) ? step.next.find((r) => r.when == null) : null;
    step.next = def ? (def.go || '') : (typeof step.next === 'string' ? step.next : '');
  }
  structuralChange();
}

/* Editor de salida con ramificación condicional por flag (un destino fijo, o
   reglas "si flag=valor → va a"). Reusado por nodos Continuar y Campo de texto. */
function appendNextEditor(id, step) {
  const branched = Array.isArray(step.next);
  const head = el('div', { className: 'lbl row' });
  head.append(el('span', { textContent: 'Siguiente' }));
  const brLabel = el('label', { className: 'toggle' });
  const brCb = el('input', { type: 'checkbox' }); brCb.checked = branched;
  brCb.onchange = () => toggleBranch(id, brCb.checked);
  brLabel.append(brCb, document.createTextNode('ramificar según flag'));
  head.append(brLabel);
  inspector.append(head);

  if (!branched) {
    inspector.append(nextSelect(typeof step.next === 'string' ? step.next : '', id, (v) => { step.next = v; structuralChange(); }));
    return;
  }
  /* El "por defecto" (sin `when`) se muestra siempre primero; después las
     condiciones. La posición no afecta: el default es el fallback. */
  const def = step.next.find((r) => r.when == null);
  const conds = step.next.filter((r) => r.when != null);
  const ordered = def ? [def, ...conds] : conds;

  ordered.forEach((rule) => {
    const isDefault = rule.when == null;
    const box = el('div', { className: 'opt' });
    const headRow = el('div', { className: 'opt__head' });
    headRow.append(el('span', { textContent: isDefault ? 'por defecto' : 'si…' }));
    if (!isDefault) {
      const rm = el('button', { className: 'del', textContent: '✕' });
      rm.onclick = () => { step.next.splice(step.next.indexOf(rule), 1); structuralChange(); };
      headRow.append(rm);
    }
    box.append(headRow);

    if (!isDefault) {
      appendClauseEditor(box, rule, 'when', { onRender: renderInspector });
    }
    box.append(el('span', { className: 'lbl', textContent: 'Va a' }));
    box.append(nextSelect(rule.go, id, (v) => { rule.go = v; structuralChange(); }));
    inspector.append(box);
  });
  const addRule = el('button', { textContent: '+ rama', style: 'margin-top:8px' });
  addRule.onclick = () => { step.next.push({ when: { op: 'and', terms: [{ flag: '', value: '' }] }, go: '' }); structuralChange(); };
  inspector.append(addRule);
  inspector.append(el('div', { className: 'hint', textContent: 'Las condiciones se evalúan en orden; la primera que se cumple gana. Si ninguna, va por defecto.' }));
}

function renderInspector() {
  $('#playHere').disabled = !(selected && script.steps[selected]);
  if (!selected || !script.steps[selected]) { inspector.classList.remove('open'); inspector.innerHTML = ''; return; }
  const id = selected, step = script.steps[id], k = kindOf(step);
  inspector.innerHTML = '';
  inspector.classList.add('open');

  const idInput = el('input', { value: id });
  idInput.onchange = () => renameStep(id, idInput.value);
  const close = el('button', { className: 'ghost', textContent: '✕' });
  close.onclick = deselect;
  inspector.append(el('div', { className: 'insp__head' }, [
    el('span', { className: 'lbl', textContent: 'id', style: 'margin:0' }),
    idInput, el('span', { className: 'spacer' }), close,
  ]));

  const textVariable = step.text && typeof step.text === 'object';
  const textHead = el('div', { className: 'lbl row' });
  textHead.append(el('span', { textContent: 'Texto' }));
  const tvLabel = el('label', { className: 'toggle' });
  const tvCb = el('input', { type: 'checkbox' }); tvCb.checked = !!textVariable;
  tvCb.onchange = () => toggleTextVariable(id, tvCb.checked);
  tvLabel.append(tvCb, document.createTextNode('variable según flag'));
  textHead.append(tvLabel);
  inspector.append(textHead);

  if (!textVariable) {
    const text = el('textarea', { value: step.text || '' });
    text.oninput = () => { step.text = text.value; markDirty(); updateNodeText(id); };
    inspector.append(text);
  } else {
    const tv = step.text;
    const incoming = incomingCases(id);
    const flags = [...new Set(incoming.map((c) => c.flag))];
    /* Si una sola flag converge acá, la elegimos sola. */
    if (!tv.on && flags.length === 1) tv.on = flags[0];

    inspector.append(el('span', { className: 'lbl', textContent: 'Según la flag' }));
    const onInp = el('input', { value: tv.on || '', placeholder: 'nombre de flag', list: 'flagnames' });
    onInp.oninput = () => { tv.on = onInp.value; markDirty(); renderInspector(); };
    inspector.append(onInp);

    const covered = new Set();
    const caseBox = (value, label, removable) => {
      covered.add(value);
      const ta = el('textarea', { value: tv.cases[value] || '', placeholder: 'texto para esta entrada' });
      ta.oninput = () => { tv.cases[value] = ta.value; markDirty(); updateNodeText(id); };
      const head = [el('span', { textContent: label })];
      if (removable) {
        const rm = el('button', { className: 'del', textContent: '✕' });
        rm.onclick = () => { delete tv.cases[value]; markDirty(); renderInspector(); updateNodeText(id); };
        head.push(rm);
      }
      inspector.append(el('div', { className: 'opt' }, [el('div', { className: 'opt__head' }, head), ta]));
    };

    const auto = incoming.filter((c) => c.flag === tv.on);
    if (auto.length) {
      inspector.append(el('span', { className: 'lbl', textContent: 'Respuesta según la elección' }));
      for (const c of auto) caseBox(c.value, '« ' + c.label + ' »', false);
    }

    /* Casos manuales: valores de la flag que no vienen de una opción entrante. */
    const extra = Object.keys(tv.cases).filter((v) => !covered.has(v));
    if (extra.length || !auto.length) {
      inspector.append(el('span', { className: 'lbl', textContent: auto.length ? 'Otros casos (valor → texto)' : 'Casos (valor → texto)' }));
      for (const val of extra) {
        const vi = el('input', { value: val, placeholder: 'valor de la flag' });
        const ta = el('textarea', { value: tv.cases[val], placeholder: 'texto para este valor' });
        const rm = el('button', { className: 'del', textContent: '✕' });
        ta.oninput = () => { tv.cases[val] = ta.value; markDirty(); updateNodeText(id); };
        vi.onchange = () => {
          const nv = vi.value.trim(); if (nv === val) return;
          const t = tv.cases[val]; delete tv.cases[val]; if (nv) tv.cases[nv] = t;
          markDirty(); renderInspector(); updateNodeText(id);
        };
        rm.onclick = () => { delete tv.cases[val]; markDirty(); renderInspector(); updateNodeText(id); };
        inspector.append(el('div', { className: 'opt' }, [el('div', { className: 'opt__head' }, [vi, rm]), ta]));
      }
      const addCase = el('button', { textContent: '+ caso', style: 'margin-top:8px' });
      addCase.onclick = () => { let n = 'valor'; while (tv.cases[n] !== undefined) n += '_'; tv.cases[n] = ''; markDirty(); renderInspector(); };
      inspector.append(addCase);
    }

    inspector.append(el('span', { className: 'lbl', textContent: 'Texto por defecto' }));
    const def = el('textarea', { value: tv.default || '' });
    def.oninput = () => { tv.default = def.value; markDirty(); updateNodeText(id); };
    inspector.append(def);
  }

  const guide = el('div', { className: 'hint guide' });
  guide.innerHTML =
    'Efectos en el texto:'
    + '<br>· flag: <code>{nombre}</code> inserta el valor'
    + '<br>· pausa: <code>{{600}}</code> ms <span class="dim">(o {{beat}}, {{pause}})</span>'
    + '<br>· salto de línea: <code>\\n</code>'
    + '<br>· estilo: <code>[[wave accent]]texto[[/]]</code>'
    + '<br>· efectos: <code>wave</code> · colores: <code>accent</code>, <code>cyan</code>, <code>muted</code>, o <code>#hex</code>';
  inspector.append(guide);

  inspector.append(el('span', { className: 'lbl', textContent: 'Música al entrar' }));
  const musInp = el('input', { value: step.music ?? '', placeholder: 'tema (sin .mp3) · vacío = sin cambio', list: 'musicnames' });
  musInp.oninput = () => {
    const v = musInp.value.trim();
    if (v) step.music = v; else delete step.music;
    markDirty(); updateNodeText(id);
  };
  inspector.append(musInp);
  inspector.append(el('div', { className: 'hint', textContent: 'Cambia de tema (con fundido) al entrar. Vacío = no toca la música. "none" = la corta.' }));

  inspector.append(el('span', { className: 'lbl', textContent: 'Flags al entrar' }));
  if (!step.set || Object.keys(step.set).length === 0) {
    const addSet = el('button', { className: 'ghost', textContent: '+ setear flag al entrar', style: 'font-size:11px' });
    addSet.onclick = () => { step.set = { flag: '' }; markDirty(); renderInspector(); };
    inspector.append(addSet);
  } else {
    inspector.append(kvEditor(step.set, '+ flag', () => {
      if (Object.keys(step.set).length === 0) delete step.set;
      markDirty(); renderGraph(); renderInspector();
    }));
  }

  inspector.append(el('span', { className: 'lbl', textContent: 'Salida' }));
  const kindSel = el('select');
  for (const [v, label] of [['next', 'Continuar'], ['choice', 'Elección'], ['input', 'Campo de texto'], ['end', 'Fin']])
    kindSel.append(el('option', { value: v, textContent: label }));
  kindSel.value = k;
  kindSel.onchange = () => changeKind(id, kindSel.value);
  inspector.append(kindSel);

  if (k === 'input') {
    const spec = step.input;
    inspector.append(el('span', { className: 'lbl', textContent: 'Guarda lo escrito en la flag' }));
    const flagInp = el('input', { value: spec.flag || '', placeholder: 'nombre', list: 'flagnames' });
    flagInp.oninput = () => { spec.flag = flagInp.value.trim(); markDirty(); renderGraph(); };
    inspector.append(flagInp);

    inspector.append(el('span', { className: 'lbl', textContent: 'Máx. caracteres' }));
    const maxInp = el('input', { type: 'number', min: '1', max: '200', value: spec.max ?? 20 });
    maxInp.oninput = () => { spec.max = Math.max(1, Number(maxInp.value) || 1); markDirty(); };
    inspector.append(maxInp);

    inspector.append(el('span', { className: 'lbl', textContent: 'Placeholder (opcional)' }));
    const phInp = el('input', { value: spec.placeholder || '', placeholder: 'Tu nombre…' });
    phInp.oninput = () => { spec.placeholder = phInp.value; markDirty(); };
    inspector.append(phInp);

    inspector.append(el('div', { className: 'hint', textContent: 'El jugador escribe libremente; se guarda en la flag y podés usarlo con {' + (spec.flag || 'flag') + '}.' }));
    appendNextEditor(id, step);
  }

  if (k === 'next') {
    appendNextEditor(id, step);
  }

  if (k === 'choice') {
    inspector.append(el('span', { className: 'lbl', textContent: 'Opciones' }));
    step.options.forEach((opt, i) => {
      const rm = el('button', { className: 'del', textContent: '✕' });
      rm.onclick = () => { step.options.splice(i, 1); structuralChange(); };
      const box = el('div', { className: 'opt' }, [
        el('div', { className: 'opt__head' }, [el('span', { textContent: '#' + (i + 1) }), rm]),
      ]);

      const labelInput = el('input', { value: opt.label || '', placeholder: 'Texto del botón' });
      labelInput.oninput = () => { opt.label = labelInput.value; markDirty(); };
      box.append(labelInput);

      box.append(el('span', { className: 'lbl', textContent: 'Va a' }));
      const destVal = 'next' in opt ? (opt.next || '') : (typeof step.next === 'string' ? step.next : '');
      box.append(nextSelect(destVal, id, (v) => { opt.next = v; structuralChange(); }));

      if (opt.set && Object.keys(opt.set).length > 0) {
        box.append(el('span', { className: 'lbl', textContent: 'Guarda' }));
        box.append(kvEditor(opt.set, '+ flag', () => {
          if (Object.keys(opt.set).length === 0) delete opt.set;
          markDirty(); renderGraph(); renderInspector();
        }));
      } else {
        const addF = el('button', { className: 'ghost', textContent: '+ guardar flag', style: 'margin-top:6px;font-size:11px' });
        addF.onclick = () => { opt.set = { '': '' }; markDirty(); renderInspector(); };
        box.append(addF);
      }

      if (opt.when) {
        box.append(el('span', { className: 'lbl', textContent: 'Mostrar si' }));
        appendClauseEditor(box, opt, 'when', {
          onEmpty: () => { delete opt.when; markDirty(); renderInspector(); },
          onRender: renderInspector,
        });
      } else {
        const addWhen = el('button', { className: 'ghost', textContent: '+ mostrar si…', style: 'margin-top:6px;font-size:11px' });
        addWhen.onclick = () => { opt.when = { op: 'and', terms: [{ flag: '', value: '' }] }; markDirty(); renderInspector(); };
        box.append(addWhen);
      }
      inspector.append(box);
    });
    const addOpt = el('button', { textContent: '+ opción', style: 'margin-top:10px' });
    addOpt.onclick = () => { step.options.push({ label: 'Nueva opción' }); structuralChange(); };
    inspector.append(addOpt);

    if (step.options.length === 0) inspector.append(el('div', { className: 'hint warn', textContent: 'Sin opciones, no puede avanzar.' }));
  }

  if (k === 'end') inspector.append(el('div', { className: 'hint', textContent: 'Este paso termina la novela.' }));

  const startBtn = el('button', { textContent: id === script.start ? '★ es el inicio' : 'Marcar como inicio', disabled: id === script.start });
  startBtn.onclick = () => { script.start = id; structuralChange(); };
  const delBtn = el('button', { className: 'del', textContent: 'Borrar paso', disabled: id === script.start });
  delBtn.onclick = () => deleteStep(id);
  inspector.append(el('div', { className: 'insp__actions' }, [startBtn, delBtn]));
  refreshFlagList();
}

function addNode() {
  const id = freshId();
  script.steps[id] = { text: '' };
  pos[id] = {
    x: (canvas.clientWidth / 2 - view.x) / view.z - W / 2,
    y: (canvas.clientHeight / 2 - view.y) / view.z - H / 2,
  };
  savePos(); markDirty(); select(id);
}

function fit() { view = { x: 60, y: 60, z: 1 }; applyView(); }

canvas.addEventListener('mousedown', (e) => {
  if (e.target.closest('.node') || e.target.closest('.inspector')) return;
  const start = { mx: e.clientX, my: e.clientY, vx: view.x, vy: view.y };
  canvas.classList.add('panning');
  const move = (ev) => { view.x = start.vx + (ev.clientX - start.mx); view.y = start.vy + (ev.clientY - start.my); applyView(); };
  const up = () => { canvas.classList.remove('panning'); window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
  window.addEventListener('mousemove', move);
  window.addEventListener('mouseup', up);
});

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.1 : 1 / 1.1;
  const nz = Math.min(2, Math.max(0.4, view.z * factor));
  const rect = canvas.getBoundingClientRect();
  const cx = e.clientX - rect.left, cy = e.clientY - rect.top;
  view.x = cx - (cx - view.x) * (nz / view.z);
  view.y = cy - (cy - view.y) * (nz / view.z);
  view.z = nz;
  applyView();
}, { passive: false });

$('#add').onclick = addNode;
$('#fit').onclick = fit;
$('#save').onclick = save;
$('#reload').onclick = () => { if (!dirty || confirm('Descartar cambios sin guardar?')) load(); };
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); save(); }
  if (e.key === 'Escape') { if (overlay.classList.contains('open')) pvClose(); else deselect(); }
});

const overlay = $('#overlay');
/* Igual que el juego real: al terminar fundimos a negro durante PV_FADE (ms). */
const PV_FADE = 5000;
let pv = { id: null, rich: { chars: [], pauses: {} }, typing: false, timer: 0, flags: {}, fading: false };
function pvStop() { clearTimeout(pv.timer); pv.typing = false; }
function pvClose() {
  pvStop(); pvMusic('none'); overlay.classList.remove('open');
  pv.fading = false;
  const box = $('.pv');
  if (box) { box.style.transition = ''; box.style.opacity = ''; }
}
/* Fin de la novela: el contenido y la música se desvanecen lentamente sobre el
   fondo negro del overlay; al terminar el fundido, cerramos. */
function pvEnd() {
  if (pv.fading) return;
  pv.fading = true;
  pvStop();
  if (pvAudio) pvFadeAudio(pvAudio, pvAudio.volume, 0, PV_FADE, () => { try { pvAudio.pause(); } catch {} pvAudio = null; pvMusicTrack = null; });
  const box = $('.pv');
  box.style.transition = `opacity ${PV_FADE}ms ease`;
  void box.offsetWidth;   // fuerza el reflow para que el transition arranque
  box.style.opacity = '0';
  pv.timer = setTimeout(pvClose, PV_FADE + 60);
}

/* ── Música del preview (crossfade con <audio>, espejo del juego real) ── */
const PV_MUS_FADE = 1800, PV_MUS_VOL = 0.5;
let pvAudio = null, pvMusicTrack = null;
function pvFadeAudio(a, from, to, ms, done) {
  const steps = 30, dt = Math.max(16, ms / steps);
  let i = 0; a.volume = Math.max(0, Math.min(1, from));
  const id = setInterval(() => {
    i++; a.volume = Math.max(0, Math.min(1, from + (to - from) * (i / steps)));
    if (i >= steps) { clearInterval(id); if (done) done(); }
  }, dt);
}
/* m === undefined → no toca; "none"/"stop"/"" → corta; otro → cambia de tema. */
function pvMusic(m) {
  if (m === undefined) return;
  const next = (!m || m === 'none' || m === 'stop') ? null : m;
  if (next === pvMusicTrack) return;
  pvMusicTrack = next;
  const prev = pvAudio;
  if (prev) pvFadeAudio(prev, prev.volume, 0, PV_MUS_FADE, () => { try { prev.pause(); } catch {} });
  if (!next) { pvAudio = null; return; }
  const a = new Audio('/music/' + encodeURIComponent(next) + '.mp3');
  a.loop = true; a.volume = 0;
  a.play().catch(() => {});
  pvFadeAudio(a, 0, PV_MUS_VOL, PV_MUS_FADE);
  pvAudio = a;
}

/* Parser de texto enriquecido (espejo de narrative.ts): {{ms}} y [[wave color]]…[[/]]. */
const PV_COLORS = { accent: 'var(--accent)', cyan: 'var(--accent-2)', muted: 'var(--muted)', text: 'var(--text)' };
const PV_PAUSE = { beat: 400, pause: 900 };
function pvColor(tok) { return /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(tok) ? tok : (PV_COLORS[tok] || null); }
function parseRichEd(raw) {
  const chars = [], pauses = {};
  let wave = false, color = null, i = 0;
  while (i < raw.length) {
    if (raw.startsWith('[[/]]', i)) { wave = false; color = null; i += 5; continue; }
    if (raw.startsWith('[[', i)) {
      const end = raw.indexOf(']]', i + 2);
      if (end !== -1) {
        for (const t of raw.slice(i + 2, end).trim().split(/\s+/)) {
          if (t === 'wave') wave = true; else { const c = pvColor(t); if (c) color = c; }
        }
        i = end + 2; continue;
      }
    }
    if (raw.startsWith('{{', i)) {
      const end = raw.indexOf('}}', i + 2);
      if (end !== -1) {
        const body = raw.slice(i + 2, end).trim();
        const ms = PV_PAUSE[body] ?? parseInt(body, 10);
        if (ms > 0) pauses[chars.length] = (pauses[chars.length] || 0) + ms;
        i = end + 2; continue;
      }
    }
    if (raw.startsWith('\\n', i)) { chars.push({ ch: '\n', wave, color }); i += 2; continue; }
    chars.push({ ch: raw[i], wave, color }); i += 1;
  }
  return { chars, pauses };
}
function pvAppendChar(c, idx) {
  const box = $('#pvText');
  /* Salto y espacio cierran la palabra actual (son puntos de corte de línea). */
  if (c.ch === '\n') { pv.wordEl = null; box.append(document.createElement('br')); return; }
  if (c.ch === ' ') { pv.wordEl = null; box.append(el('span', { className: 'pv__char', textContent: ' ' })); return; }
  /* Las letras se acumulan en una "palabra" (inline-block, sin corte interno)
     para que las onduladas nunca partan la palabra al medio. */
  if (!pv.wordEl) { pv.wordEl = el('span', { className: 'pv__word' }); box.append(pv.wordEl); }
  let style = c.color ? 'color:' + c.color + ';' : '';
  if (c.wave) style += `animation-delay:${idx * -0.09}s;animation-duration:3.2s;`;
  pv.wordEl.append(el('span', {
    className: c.wave ? 'pv__char pv__wave' : 'pv__char',
    style,
    textContent: c.ch,
  }));
}
function pvMatches(cond) {
  if (!cond) return true;
  if (Array.isArray(cond.terms)) {
    const terms = cond.terms.filter((t) => t && t.flag);
    if (!terms.length) return false;
    const test = (t) => String(pv.flags[t.flag] ?? '') === String(t.value);
    return cond.op === 'or' ? terms.some(test) : terms.every(test);
  }
  const entries = Object.entries(cond);
  if (!entries.length) return true;
  return entries.every(([k, v]) => String(pv.flags[k] ?? '') === String(v));
}
function pvText(step) {
  const t = step.text;
  let s = '';
  if (t) {
    if (typeof t === 'string') s = t;
    else { const v = pv.flags[t.on]; s = v != null && t.cases[v] != null ? t.cases[v] : (t.default || ''); }
  }
  return s.replace(/\{(\w+)\}/g, (m, n) => (n in pv.flags ? pv.flags[n] : m));
}
function pvOptions(step) { return (step.options || []).filter((o) => pvMatches(o.when)); }
function pvNext(next) {
  if (next == null) return null;
  if (typeof next === 'string') return next || null;
  let fallback = null, has = false;
  for (const r of next) {
    if (r.when == null) { if (!has) { fallback = r.go || null; has = true; } continue; }
    if (pvMatches(r.when)) return r.go || null;
  }
  return fallback;
}
function pvGo(dest) { (dest && script.steps[dest]) ? pvType(dest) : pvEnd(); }
function pvType(id) {
  pvStop();
  /* Por si reabrimos mientras un fundido de fin seguía en curso. */
  pv.fading = false;
  const box = $('.pv');
  if (box) { box.style.transition = ''; box.style.opacity = ''; }
  const step = script.steps[id];
  if (!step) return pvClose();
  pvMusic(step.music);
  if (step.set) Object.assign(pv.flags, step.set);
  pv.id = id; pv.rich = parseRichEd(pvText(step));
  $('#pvText').innerHTML = ''; $('#pvAfter').innerHTML = ''; pv.wordEl = null;
  pv.typing = true;
  const total = pv.rich.chars.length;
  if (total === 0) { pv.typing = false; return pvDone(id); }
  let n = 0;
  const tick = () => {
    pvAppendChar(pv.rich.chars[n], n); n += 1;
    if (n >= total) { pv.typing = false; return pvDone(id); }
    pv.timer = setTimeout(tick, 32 + (pv.rich.pauses[n] || 0));
  };
  pv.timer = setTimeout(tick, 32 + (pv.rich.pauses[0] || 0));
}
function pvComplete() {
  pvStop();
  $('#pvText').innerHTML = ''; pv.wordEl = null;
  pv.rich.chars.forEach((c, idx) => pvAppendChar(c, idx));
  pvDone(pv.id);
}
function pvDone(id) {
  pvStop();
  const step = script.steps[id], after = $('#pvAfter'); after.innerHTML = '';
  const k = kindOf(step);
  if (k === 'choice') {
    const opts = pvOptions(step);
    const orbit = opts.length >= 6;     // 6+ opciones: layout orbital
    const ul = el('ul', { className: orbit ? 'pv__orbit' : 'pv__opts' });
    opts.forEach((opt, i) => {
      const b = el('button', { textContent: opt.label, className: orbit ? 'pv__oorbit' : '' });
      b.onclick = (e) => {
        e.stopPropagation();
        if (opt.set) Object.assign(pv.flags, opt.set);
        pvGo('next' in opt ? (opt.next || null) : pvNext(step.next));
      };
      if (orbit) {
        const li = el('li', { className: 'pv__orbiter' }, b);
        li.style.setProperty('--a', (360 / opts.length) * i + 'deg');
        ul.append(li);
      } else {
        ul.append(el('li', {}, b));
      }
    });
    after.append(ul);
  } else if (k === 'input') {
    const spec = step.input, max = spec.max ?? 20, min = spec.min ?? 1;
    const field = el('input', { type: 'text', maxLength: max, placeholder: spec.placeholder || '' });
    const ok = el('button', { textContent: '→' });
    const submit = (e) => {
      e?.stopPropagation();
      const v = field.value.trim();
      if (v.length < min || v.length > max) return;
      pv.flags[spec.flag] = v;
      pvGo(pvNext(step.next));
    };
    ok.onclick = submit;
    field.onkeydown = (e) => { if (e.key === 'Enter') submit(e); };
    const wrap = el('div', { className: 'pv__opts' }, [field, ok]);
    wrap.onclick = (e) => e.stopPropagation();
    after.append(wrap);
    setTimeout(() => field.focus(), 0);
  } else after.append(el('div', { className: 'pv__arrow', textContent: k === 'next' ? '↓' : '— fin —' }));
}
overlay.onclick = () => {
  if (pv.fading) return;
  if (pv.typing) return pvComplete();
  const step = script.steps[pv.id]; if (!step) return pvClose();
  const k = kindOf(step);
  if (k === 'next') pvGo(pvNext(step.next));
  else if (k === 'end') pvEnd();
};
$('#play').onclick = () => { pv.flags = {}; overlay.classList.add('open'); pvType(script.start); };

/* Flags de muestra para "probar desde aquí": para cada flag elegimos un valor
   que alguien podría haber elegido en el camino. Las que vienen de un `set`
   (al entrar o por una opción) toman ese valor concreto; las de campo de texto
   (sin valor enumerado) toman una muestra legible. */
function defaultFlags() {
  const flags = {};
  const consider = (set) => {
    if (!set) return;
    for (const [k, v] of Object.entries(set)) if (k && !(k in flags)) flags[k] = v;
  };
  for (const s of Object.values(script.steps)) {
    consider(s.set);
    if (Array.isArray(s.options)) for (const o of s.options) consider(o.set);
  }
  for (const s of Object.values(script.steps)) {
    const f = s.input && s.input.flag;
    if (f && !(f in flags)) flags[f] = /nombre|name/i.test(f) ? 'Jugador' : '(' + f + ')';
  }
  return flags;
}
$('#playHere').onclick = () => {
  if (!selected || !script.steps[selected]) return;
  pv.flags = defaultFlags();
  overlay.classList.add('open');
  pvType(selected);
};

applyView();
load();
</script>
</body>
</html>
